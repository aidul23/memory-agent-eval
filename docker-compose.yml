# Local infra for the memory-agent-eval experiments.
#
# Bring services up one at a time as we wire them in:
#   docker compose up -d hindsight
#
# Each service reads its secrets from the sibling `.env` file (the same
# `.env` the Python runner already uses).

services:
  # --- Vectorize.io Hindsight -----------------------------------------
  # Consumed by `src/memory/vectorize_hindsight_memory.py` via the
  # `hindsight-client` SDK pointed at HINDSIGHT_API_URL.
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: mae-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"   # API (used by the eval runner)
      - "9999:9999"   # Control-plane UI (optional, handy for debugging)
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_MODEL: gpt-4o-mini
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import socket,sys;
          s=socket.socket(); s.settimeout(3);
          s.connect(('127.0.0.1', 8888)); s.close()" || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # --- Qdrant (only needed for Mem0 OSS mode) -------------------------
  # Mem0 hosted (MEM0_API_KEY set) does NOT need this. Bring it up only
  # when running Mem0 OSS: `docker compose --profile mem0-oss up -d qdrant`.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mae-qdrant
    restart: unless-stopped
    profiles: ["mem0-oss"]
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python3 -c "import socket,sys;
          s=socket.socket(); s.settimeout(3);
          s.connect(('127.0.0.1', 6333)); s.close()" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  hindsight_data:
  qdrant_data:
